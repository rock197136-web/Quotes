name: Update market and deploy Pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/snapshot.json', 'snapshot.json', 'README.md', 'tests/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test frontend
        run: node tests/frontend.cjs
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect public references and dated market feed
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MARKET_FEED_URLS: ${{ secrets.MARKET_FEED_URLS }}
        run: python scripts/update_market.py
      - name: Save shared data history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update shared market snapshot [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp data/snapshot.json _site/snapshot.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
